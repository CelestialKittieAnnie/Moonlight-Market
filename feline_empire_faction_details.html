<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Feline Empire</title>
    <link rel="stylesheet" href="assets/css/styles.css">
  </head>
  <body>
    <header>
      <h1>The Feline Empire</h1>
    </header>
    <main>
      <article class="country-card">
        <h2 id="feline-name">Feline Empire</h2>
        <label for="feline-rename-input">Rename faction:</label>
        <input id="feline-rename-input" type="text" placeholder="Enter new name">
        <button id="feline-rename-btn" type="button">Rename</button>
        <p><strong>Capital:</strong> <span id="feline-capital">Viyat-Caelus</span></p>
        <p><strong>Continent:</strong> <span id="feline-continent">Calderia the Main Continent</span></p>
        <p><strong>Population:</strong> <span id="feline-population">12,000,000 Population, 1.5% Military</span></p>
      </article>
    </main>
    <script src="feline_empire.js"></script>
  </body>
</html>
